<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60; url=/?auto=1">
<title>uploadserver status</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
    margin: 2em;
  }
  h1 {
    font-size: 1em;
    font-weight: normal;
    color: #888;
    margin: 0 0 1em;
  }
  table {
    border-collapse: collapse;
  }
  td {
    padding: 1px 2em 1px 0;
    vertical-align: top;
  }
  td:first-child {
    color: #777;
  }
  p {
    color: #666;
    font-size: 12px;
    margin-top: 1.5em;
    max-width: 40em;
  }
</style>
</head>
<body>
<h1>uploadserver</h1>
<table>
  <tr><td>uptime</td><td>{{.Uptime}}</td></tr>
  <tr><td>serving since</td><td>{{.ServingSince}}</td></tr>
  <tr><td>storage used</td><td>{{.StorageUsed}}</td></tr>
  <tr><td>transferred</td><td>{{.Transferred}}</td></tr>
</table>
<p>Aggregate counters only. Page refreshes itself every minute.</p>
</body>
</html>
