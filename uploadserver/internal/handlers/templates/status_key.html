<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uploadserver status</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.5;
    margin: 2em;
  }
  h1 {
    font-size: 1em;
    font-weight: normal;
    color: #888;
    margin: 0 0 1em;
  }
  p {
    color: #666;
    font-size: 12px;
    max-width: 40em;
  }
  .error {
    color: #c66;
  }
  input[type="password"] {
    background: #181818;
    color: #ccc;
    border: 1px solid #333;
    font-family: monospace;
    font-size: 14px;
    padding: 4px 8px;
    width: 20em;
  }
  button {
    background: #222;
    color: #ccc;
    border: 1px solid #444;
    font-family: monospace;
    font-size: 14px;
    padding: 4px 12px;
    cursor: pointer;
  }
  button:hover {
    background: #2a2a2a;
  }
</style>
</head>
<body>
<h1>uploadserver status</h1>
<p>Owner access only — paste your API key to open the dashboard.</p>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/status">
  <input type="password" name="key" autocomplete="off" autofocus>
  <button type="submit">Unlock</button>
</form>
</body>
</html>
